name: Publish to MCP registry

# Manual fallback: republishes the committed server.json as-is (e.g. after a
# metadata-only edit). Normal releases don't need this — publish.yml pushes to
# the registry automatically after every npm release, with versions synced from
# the tag. OIDC from this org-owned repo grants io.github.sheetrender/*.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for mcp-publisher login github-oidc
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
