name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"
      # The package.json scripts execute under node explicitly; pin it rather
      # than riding whatever the runner image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: deno install --frozen
      - run: deno task build
      - run: deno task test
